<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home</title>
<style>
:root{--bg:#eef0f5;--fg:#1c1f2a;--mut:#7b8194;--card:#fff;--sh:rgba(40,50,90,.18);--acc:#5b7cfa;--edge:rgba(91,124,250,.35);--ex:#c9cfe4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1017;--fg:#e9ecf5;--mut:#7d849b;--card:#181b27;--sh:rgba(0,0,0,.6);--acc:#7c9bff;--edge:rgba(124,155,255,.35);--ex:#2a3050}}
:root[data-theme="dark"]{--bg:#0e1017;--fg:#e9ecf5;--mut:#7d849b;--card:#181b27;--sh:rgba(0,0,0,.6);--acc:#7c9bff;--edge:rgba(124,155,255,.35);--ex:#2a3050}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif;transition:background .4s,color .4s;overflow-x:hidden}
.bg{position:fixed;inset:0;perspective:700px;pointer-events:none;overflow:hidden}
.cube{position:absolute;width:var(--s);height:var(--s);transform-style:preserve-3d;animation:spin var(--d) linear infinite;left:var(--x);top:var(--y);opacity:.7}
.cube i{position:absolute;inset:0;border:1.5px solid var(--edge);background:linear-gradient(135deg,var(--edge),transparent);border-radius:8px}
.cube i:nth-child(1){transform:translateZ(calc(var(--s)/2))}
.cube i:nth-child(2){transform:rotateY(180deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(3){transform:rotateY(90deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
@keyframes spin{from{transform:rotateX(0) rotateY(0) translateZ(0)}50%{transform:rotateX(180deg) rotateY(180deg) translateZ(60px)}to{transform:rotateX(360deg) rotateY(360deg) translateZ(0)}}
main{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:56px 20px 40px;gap:30px;perspective:900px}
.theme{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:5;width:44px;height:44px;border:0;border-radius:14px;background:var(--card);color:var(--fg);font-size:20px;box-shadow:0 4px 0 var(--ex),0 10px 18px var(--sh);transition:transform .15s,box-shadow .15s}
.theme:active{transform:translateY(4px);box-shadow:0 0 0 var(--ex),0 3px 6px var(--sh)}
.stage{transform-style:preserve-3d;transition:transform .15s ease-out;text-align:center;margin-top:10px}
.time{font-size:clamp(64px,22vw,104px);font-weight:700;letter-spacing:-3px;line-height:1;transform:translateZ(60px);
text-shadow:0 1px 0 var(--ex),0 2px 0 var(--ex),0 3px 0 var(--ex),0 4px 0 var(--ex),0 5px 0 var(--ex),0 6px 0 var(--ex),0 8px 0 var(--ex),0 18px 24px var(--sh)}
.time span{color:var(--acc);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.date{margin-top:14px;color:var(--mut);font-size:15px;letter-spacing:.5px;transform:translateZ(30px)}
.search{width:100%;max-width:460px;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:20px;padding:6px 6px 6px 18px;box-shadow:0 5px 0 var(--ex),0 18px 30px var(--sh);transform:rotateX(4deg);transition:transform .25s}
.search:focus-within{transform:rotateX(0) translateY(-3px) scale(1.02)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--fg);font-size:17px;padding:13px 0}
.search input::placeholder{color:var(--mut)}
.search button{border:0;width:46px;height:46px;border-radius:15px;background:var(--acc);color:#fff;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.search button:active{transform:translateY(3px);box-shadow:none}
.grid{width:100%;max-width:460px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px 14px;transform:rotateX(8deg);transform-style:preserve-3d}
.sc{display:flex;flex-direction:column;align-items:center;gap:9px;color:var(--fg);text-decoration:none;font-size:12px;position:relative;user-select:none;-webkit-user-select:none}
.ic{width:100%;max-width:72px;aspect-ratio:1;border-radius:20px;background:var(--card);display:grid;place-items:center;font-size:30px;box-shadow:0 6px 0 var(--ex),0 14px 20px var(--sh);transition:transform .15s,box-shadow .15s}
.sc:active .ic{transform:translateY(6px);box-shadow:0 0 0 var(--ex),0 3px 6px var(--sh)}
.ic img{width:58%;height:58%;object-fit:contain;border-radius:10px}.ic b{font-size:30px;font-weight:700}
.sc span{color:var(--mut);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{position:absolute;top:-6px;right:2px;width:22px;height:22px;border-radius:50%;background:#ff5d6c;color:#fff;border:0;font-size:12px;display:none}
.edit .x{display:block}.edit .ic{animation:wig .35s infinite alternate}
@keyframes wig{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.add .ic{color:var(--acc);font-size:32px}
.hint{color:var(--mut);font-size:12px;opacity:.7}
dialog{border:0;border-radius:22px;background:var(--card);color:var(--fg);padding:22px;width:min(88vw,340px);box-shadow:0 20px 50px var(--sh)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog input{width:100%;margin:6px 0;padding:13px;border-radius:12px;border:1.5px solid var(--edge);background:var(--bg);color:var(--fg);font-size:16px;outline:0}
dialog .r{display:flex;gap:10px;margin-top:12px}
dialog button{flex:1;padding:12px;border-radius:12px;border:0;font-size:15px;background:var(--bg);color:var(--fg)}
dialog button.p{background:var(--acc);color:#fff}
@media(prefers-reduced-motion:reduce){.cube,.edit .ic,.time span{animation:none}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
<div class="cube" style="--s:70px;--x:12%;--y:14%;--d:22s"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="cube" style="--s:46px;--x:78%;--y:30%;--d:16s"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="cube" style="--s:90px;--x:70%;--y:72%;--d:28s"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="cube" style="--s:38px;--x:16%;--y:78%;--d:19s"><i></i><i></i><i></i><i></i><i></i><i></i></div>
</div>
<button class="theme" id="theme" aria-label="Toggle theme">◐</button>
<main>
<div class="stage" id="stage">
<div class="time" id="time">00<span>:</span>00</div>
<div class="date" id="date"></div>
</div>
<div class="search">
<input id="q" type="search" placeholder="Search the web" autocomplete="off" enterkeyhint="search">
<button id="go" aria-label="Search">➜</button>
</div>
<div class="grid" id="grid"></div>
<div class="hint">Hold a shortcut to edit · tilt your phone</div>
</main>
<dialog id="dlg">
<b>New shortcut</b>
<input id="dn" placeholder="Name">
<input id="du" placeholder="example.com" inputmode="url" autocapitalize="off">
<div class="r"><button id="dc">Cancel</button><button class="p" id="ds">Add</button></div>
</dialog>
<script>
const $=id=>document.getElementById(id);
const root=document.documentElement;
const def=[["YouTube","","youtube.com"],["Gmail","","mail.google.com"],["Maps","","maps.google.com"],["GitHub","","github.com"],["Reddit","","reddit.com"],["X","","x.com"],["Claude","","claude.ai"]];
let list=def;
try{const s=localStorage.getItem("hp_sc");if(s)list=JSON.parse(s)}catch(e){}
const save=()=>{try{localStorage.setItem("hp_sc",JSON.stringify(list))}catch(e){}};
try{const t=localStorage.getItem("hp_theme");if(t)root.dataset.theme=t}catch(e){}
$("theme").onclick=()=>{const dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;const n=dark?"light":"dark";root.dataset.theme=n;try{localStorage.setItem("hp_theme",n)}catch(e){}};
function tick(){const d=new Date();const p=n=>String(n).padStart(2,"0");$("time").innerHTML=p(d.getHours())+"<span>:</span>"+p(d.getMinutes());$("date").textContent=d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}
tick();setInterval(tick,1000);
function go(){const v=$("q").value.trim();if(!v)return;const u=/^(https?:\/\/)?[^\s]+\.[a-z]{2,}(\/\S*)?$/i.test(v)?(/^https?:/i.test(v)?v:"https://"+v):"https://www.google.com/search?q="+encodeURIComponent(v);location.href=u}
$("go").onclick=go;$("q").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
function render(){const g=$("grid");g.innerHTML="";
list.forEach((s,i)=>{const a=document.createElement("a");a.className="sc";a.href="https://"+s[2];
a.innerHTML='<div class="ic"><b></b></div><span></span><button class="x" aria-label="Remove">✕</button>';const ic=a.querySelector(".ic"),b=ic.firstChild;const h=[...s[2]].reduce((n,c)=>(n*31+c.charCodeAt(0))%360,7);b.textContent=(s[0][0]||"?").toUpperCase();b.style.color=`hsl(${h} 70% 55%)`;const im=new Image();im.alt="";im.onload=()=>{b.remove();ic.appendChild(im)};im.src="https://www.google.com/s2/favicons?sz=128&domain="+encodeURIComponent(s[2].split("/")[0]);
a.querySelector("span").textContent=s[0];
a.querySelector(".x").onclick=e=>{e.preventDefault();list.splice(i,1);save();render()};
let t;a.addEventListener("touchstart",()=>{t=setTimeout(()=>{g.classList.add("edit");a.dataset.l=1},550)},{passive:true});
a.addEventListener("touchend",()=>clearTimeout(t));a.addEventListener("touchmove",()=>clearTimeout(t),{passive:true});
a.addEventListener("click",e=>{if(g.classList.contains("edit")){e.preventDefault()}});
a.addEventListener("contextmenu",e=>{e.preventDefault();g.classList.add("edit")});
g.appendChild(a)});
const ad=document.createElement("a");ad.className="sc add";ad.href="#";ad.innerHTML='<div class="ic">+</div><span>Add</span>';
ad.onclick=e=>{e.preventDefault();if(g.classList.contains("edit")){g.classList.remove("edit");return}$("dn").value=$("du").value="";$("dlg").showModal()};
g.appendChild(ad)}
$("dc").onclick=()=>$("dlg").close();
$("ds").onclick=()=>{let n=$("dn").value.trim(),u=$("du").value.trim().replace(/^https?:\/\//i,"");if(!u)return;list.push([n||u.split(".")[0],"",u]);save();render();$("dlg").close()};
render();
const st=$("stage");let rx=0,ry=0;
function tilt(x,y){st.style.transform=`rotateX(${x}deg) rotateY(${y}deg)`}
addEventListener("pointermove",e=>{if(e.pointerType==="touch"&&!e.buttons)return;tilt(((innerHeight/2-e.clientY)/innerHeight)*14,((e.clientX-innerWidth/2)/innerWidth)*20)});
addEventListener("deviceorientation",e=>{if(e.beta==null)return;tilt(Math.max(-14,Math.min(14,-(e.beta-45)/3)),Math.max(-20,Math.min(20,e.gamma/2)))});
addEventListener("touchstart",()=>{if(typeof DeviceOrientationEvent!=="undefined"&&DeviceOrientationEvent.requestPermission){DeviceOrientationEvent.requestPermission().catch(()=>{})}},{once:true});
</script>
</body>
</html>
